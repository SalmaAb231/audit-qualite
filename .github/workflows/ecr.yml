name: Tests, build and push to ECR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-1
  ECR_REGISTRY: 239280167189.dkr.ecr.eu-west-1.amazonaws.com
  ECR_REPOSITORY: audit-qualite-pfa

jobs:
  test-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -q

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::239280167189:role/GitHubActionsECRRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            --tag "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" \
            --tag "${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}" \
            .

      - name: Push Docker image tags to ECR
        run: |
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

  deploy-ec2:
    needs: test-build-push
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::239280167189:role/GitHubActionsECRRole
          aws-region: eu-west-1

      - name: Send deployment command through SSM
        id: send-command
        env:
          INSTANCE_ID: i-080e098227f618f29
        run: |
          set -euo pipefail

          command_id="$(
            aws ssm send-command \
              --region "${AWS_REGION}" \
              --document-name "AWS-RunShellScript" \
              --instance-ids "${INSTANCE_ID}" \
              --parameters "commands=[\"sudo -u ec2-user -H env IMAGE_TAG=${GITHUB_SHA} /home/ec2-user/deploy_ec2.sh\"]" \
              --query "Command.CommandId" \
              --output text
          )"

          if [[ -z "${command_id}" || "${command_id}" == "None" ]]; then
            echo "Unable to retrieve the SSM Command ID." >&2
            exit 1
          fi

          printf 'command_id=%s\n' "${command_id}" >> "${GITHUB_OUTPUT}"
          printf 'SSM Command ID: %s\n' "${command_id}"

      - name: Wait for deployment and display result
        env:
          INSTANCE_ID: i-080e098227f618f29
          COMMAND_ID: ${{ steps.send-command.outputs.command_id }}
        run: |
          set -euo pipefail

          aws ssm wait command-executed \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" || true

          status="$(
            aws ssm get-command-invocation \
              --region "${AWS_REGION}" \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "Status" \
              --output text
          )"

          aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query "{Status:Status,StandardOutputContent:StandardOutputContent,StandardErrorContent:StandardErrorContent}" \
            --output json

          if [[ "${status}" != "Success" ]]; then
            printf 'SSM deployment failed with status: %s\n' "${status}" >&2
            exit 1
          fi
